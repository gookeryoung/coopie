name: CI

on:
  push:
    branches: [main, develop]
    # Skip CI for changes that cannot affect lint/test results (e.g. docs)
    paths: &ci_paths
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pyrefly.toml'
      - 'pytest.ini'
      - 'ruff.toml'
      - '.coveragerc'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths: *ci_paths
  # Allow manual full runs (bypasses the paths filter)
  workflow_dispatch:

# Least privilege: CI only needs read access to the repository
permissions:
  contents: read

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra lint

      - name: Cache ruff
        uses: actions/cache@v6
        with:
          path: .ruff_cache
          key: ruff-{% raw %}${{ runner.os }}-${{ hashFiles('pyproject.toml','ruff.toml') }}{% endraw %}

      - name: Ruff check + format
        run: |
          uv run ruff check --silent src tests --cache-dir .ruff_cache
          uv run ruff format --check src tests

      - name: Cache pyrefly
        uses: actions/cache@v6
        with:
          path: .pyrefly_cache
          key: pyrefly-{% raw %}${{ runner.os }}-${{ hashFiles('pyrefly.toml','pyproject.toml','src/**/*.py') }}{% endraw %}
          restore-keys: |
            pyrefly-{% raw %}${{ runner.os }}-{% endraw %}

      - name: Pyrefly check (parallel)
        run: uv run pyrefly check -j 0

  test:
    name: Test (Python {{ ci_test_versions|join(' & ') }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: [{% for v in ci_test_versions %}"{{ v }}"{% if not loop.last %}, {% endif %}{% endfor %}]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python {% raw %}${{ matrix.python-version }}{% endraw %}
        run: uv python install {% raw %}${{ matrix.python-version }}{% endraw %}

      {% if project_type == "gui" %}- name: Install Qt offscreen system dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1{% endif %}

      - name: Sync dependencies
{% if use_domestic_mirrors %}        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
{% endif %}        run: uv sync --frozen --extra test --python {% raw %}${{ matrix.python-version }}{% endraw %}

      - name: Run tests
        {% if project_type == "gui" %}env:
          QT_QPA_PLATFORM: offscreen{% endif %}
        run: uv run pytest -m "not slow" --cov={{ package_name }} --cov-fail-under={{ coverage_fail_under }} --cov-report=term-missing
